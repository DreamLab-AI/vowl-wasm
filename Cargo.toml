[workspace]

[package]
name = "vowl-wasm"
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DreamLab-AI/vowl-wasm"
description = "VOWL ontology visualisation engine in Rust/WASM: OWL parsing, force-directed layout (Barnes-Hut, SIMD), and rendering data for web explorers. A clean-room reimplementation of the WebVOWL visual notation."
readme = "README.md"
keywords = ["ontology", "owl", "wasm", "visualisation", "graph"]
categories = [
    "wasm",
    "visualization",
    "science",
    "web-programming",
    "data-structures",
]
exclude = ["/.github", "/deny.toml", "/examples/*.html"]

[lib]
name = "vowl_wasm"
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
] }
thiserror = "1.0"
petgraph = "0.6"
nalgebra = "0.32"
rayon = { version = "1", optional = true }
# The NGG1 codec, re-exported as `vowl_wasm::ngg1`.
ontomark-ngg1 = { version = "0.1.0", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
mockall = "0.12"
pretty_assertions = "1.4"
criterion = "0.5"
# Migration test (tests/ontomark_ngg1_migration.rs): parse Rust source, not text.
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"

[features]
# Nothing optional is on by default. The general-purpose engine — OWL/JSON
# parsing, the graph model, force layout (quadtree + CSR), OWL2 validation,
# pinning and statistics — is always compiled.
default = []

# NGG1 binary tier format plus the zero-copy `NggExplorer` binding. Estate
# specific (DreamLab's NarrativeGoldmine pipeline artefact), not something a
# general ontology-visualisation consumer needs. The codec itself is the
# `ontomark-ngg1` crate, re-exported as `vowl_wasm::ngg1`.
ngg1 = ["dep:ontomark-ngg1"]

# Explorer click/selection plumbing: ray-sphere hit testing (`interaction`) and
# the `checkNodeClick` binding.
interaction = []

# Legacy full-graph serde export (`WebVowl.getGraphData`). Off by default: it is
# an O(n) boundary serialisation deliberately removed from the explorer hot
# path, which reads positions zero-copy instead. Enable for diagnostics only.
debug-serde = []

# Data-parallel ontology loading via rayon. Native only — rayon's thread pool
# does not build for `wasm32-unknown-unknown` without extra plumbing.
parallel = ["dep:rayon"]

# WASM SIMD128 acceleration for force accumulation. Requires a build targeting
# `wasm32-unknown-unknown` with the `simd128` target feature enabled.
simd = []

# Tuned for the published `.wasm`, which is what this crate mostly ships. `z`
# over `3` costs the layout loop a little throughput and buys a much smaller
# download; `panic = "abort"` drops the unwinding machinery, which WASM cannot
# use anyway.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[[test]]
name = "integration_test"

[[test]]
name = "ontology_metadata_test"

[[test]]
name = "phase3_integration"

[[test]]
name = "ngg1_explorer_test"
required-features = ["ngg1"]

[[bench]]
name = "layout_bench"
harness = false

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "interaction_bench"
harness = false
required-features = ["interaction"]

[[bench]]
name = "phase3_benchmarks"
harness = false
required-features = ["interaction"]

[[example]]
name = "barnes_hut_benchmark"

# Deliberately off. `strip = true` above already removes the ~190 KB `name`
# section, and running binaryen on top of an `opt-level = "z"` + LTO build is a
# net loss over the wire: measured on the 0.1.1 estate bundle, `-Oz
# --strip-debug` takes the module from 1,114,091 to 1,032,999 bytes raw but
# pushes gzip from 379,414 to 395,517 and brotli from 279,066 to 288,007. Since
# every host serves this compressed, the smaller raw module is the worse
# download. (It also needs `-all` to validate rustc's bulk-memory output, which
# ties the build to a binaryen version.) Revisit if binaryen's size passes stop
# fighting the compressor.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
