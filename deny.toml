# cargo-deny policy. Checked in CI (see .github/workflows/ci.yml) and locally
# with `cargo deny check`. Licences are an allow-list of permissive terms only:
# this crate is MIT and must stay publishable under those terms.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste is unmaintained. It reaches us only as a compile-time proc-macro
    # dependency of nalgebra (via simba) — no runtime code, no attack surface —
    # and nalgebra has not yet cut a release that drops it. Remove this entry
    # once it does.
    { id = "RUSTSEC-2024-0436", reason = "paste via nalgebra -> simba; compile-time proc-macro only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
