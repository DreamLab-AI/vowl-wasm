name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, e.g. v0.1.0'
        required: true
        type: string

# `id-token: write` lets the runner mint an OIDC token that npm exchanges for a
# short-lived publish credential (npm trusted publishing). No long-lived npm
# token is stored anywhere: the trusted-publisher entry on npmjs.com for
# @dreamlab-ai/vowl-wasm names this repository and this workflow file, and
# provenance attestations are generated automatically.
permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  release:
    name: Build bundle, attach release asset, publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release

      - uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'

      # Trusted publishing needs npm >= 11.5.1 on Node >= 22.14; Node 24 ships a
      # current npm and `registry-url` writes the registry into the runner's
      # npmrc so the OIDC exchange targets registry.npmjs.org.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Resolve the release tag and check it matches the crate version
        run: |
          set -euo pipefail
          tag_ref="${{ inputs.tag || github.ref_name }}"
          tag="${tag_ref#v}"
          crate_version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$crate_version" ]; then
            echo "::error::tag $tag_ref does not match Cargo.toml version $crate_version"
            exit 1
          fi
          echo "VERSION=$crate_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag_ref" >> "$GITHUB_ENV"
          npm --version

      - name: Verify reviewed third-party release inventory
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cargo run --locked --manifest-path tools/release-inventory/Cargo.toml -- \
            verify . "$RELEASE_TAG" "$(rustc --version)" "$(wasm-pack --version)"
          # Existing browser tarballs are immutable, including on manual reruns.
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets > existing-release.json; then
            node -e 'const r=require("./existing-release.json"); if (r.assets.some(a=>a.name===`vowl-wasm-${process.env.VERSION}-pkg.tgz`)) { console.error("Browser release asset already exists; preserve it and publish a separately reviewed companion"); process.exit(1); }'
          fi

      # The published bundle is built with `ngg1,interaction`; the markdown
      # parser is gone (ontomark-parse owns it).
      - name: Build the bundle
        run: |
          wasm-pack build --target web --release --scope dreamlab-ai \
            -- --features ngg1,interaction --locked

      - name: Verify Rust and bundle contracts
        env:
          VOWL_BUNDLE_GATE: "1"
        run: |
          cargo test --locked --all-features --all-targets
          cargo test --locked --all-features --doc
          node --test tests/ngg1_wasm.test.mjs

      # npm's trusted-publisher check requires package.json repository.url to
      # match this repository exactly; wasm-pack copies Cargo.toml's
      # `repository`, which lacks the git+ prefix and .git suffix npm expects.
      - name: Pin package metadata
        run: |
          set -euo pipefail
          cd pkg
          npm pkg set repository.type=git \
            repository.url=git+https://github.com/DreamLab-AI/vowl-wasm.git \
            publishConfig.access=public
          # wasm-pack writes `"sideEffects": ["./snippets/*"]` unconditionally,
          # but this bundle ships no snippets directory. `false` is true of it
          # and lets a bundler tree-shake the glue.
          npm pkg set sideEffects=false --json
          node -e 'const p=require("./package.json"); if (p.version!==process.env.VERSION) { console.error("pkg version", p.version, "!=", process.env.VERSION); process.exit(1) }'

      - name: Include reviewed notices and exact source URLs
        run: |
          cargo run --locked --manifest-path tools/release-inventory/Cargo.toml -- \
            package . "$RELEASE_TAG" "$(rustc --version)" "$(wasm-pack --version)"

      - name: Pack the bundle
        id: pack
        run: |
          set -euo pipefail
          cd pkg
          npm pack --dry-run --json > ../npm-pack-preview.json
          node -e 'const files=require("../npm-pack-preview.json")[0].files.map(f=>f.path); for (const name of ["THIRD-PARTY-NOTICES.md","docs/UPSTREAMS.md"]) { if (!files.includes(name)) { console.error("Missing reviewed package notice",name); process.exit(1); } }'
          npm pack --json > ../npm-pack-result.json
          tarball=$(node -e 'process.stdout.write(require("../npm-pack-result.json")[0].filename)')
          mv "$tarball" "../vowl-wasm-${VERSION}-pkg.tgz"
          cd ..
          sha256sum "vowl-wasm-${VERSION}-pkg.tgz" | tee "vowl-wasm-${VERSION}-pkg.tgz.sha256"
          cp THIRD-PARTY-NOTICES.md "vowl-wasm-${VERSION}-THIRD-PARTY-NOTICES.md"
          sha256sum "vowl-wasm-${VERSION}-THIRD-PARTY-NOTICES.md" \
            > "vowl-wasm-${VERSION}-THIRD-PARTY-NOTICES.md.sha256"
          echo "tarball=vowl-wasm-${VERSION}-pkg.tgz" >> "$GITHUB_OUTPUT"

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes
          fi
          # No --clobber: the server also refuses replacement after a race.
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            "${{ steps.pack.outputs.tarball }}" \
            "${{ steps.pack.outputs.tarball }}.sha256" \
            "vowl-wasm-${VERSION}-THIRD-PARTY-NOTICES.md" \
            "vowl-wasm-${VERSION}-THIRD-PARTY-NOTICES.md.sha256"

      # OIDC trusted publishing: no token, no OTP. The exact tarball attached to
      # the GitHub release is what goes to npm, so the two artefacts are
      # byte-identical. Skips (not fails) when this version is already on the
      # registry, so a re-run of the workflow for an existing tag is safe.
      - name: Publish to npm (OIDC trusted publishing)
        run: |
          set -euo pipefail
          if npm view "@dreamlab-ai/vowl-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "@dreamlab-ai/vowl-wasm@${VERSION} is already published; skipping"
            exit 0
          fi
          npm publish "${{ steps.pack.outputs.tarball }}" --access public
          npm view "@dreamlab-ai/vowl-wasm@${VERSION}" version dist.integrity

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: vowl-wasm-pkg
          path: |
            pkg/
            ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
